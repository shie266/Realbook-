<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Real Book שלי</title>
<meta name="theme-color" content="#16171b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* Layout: one-column phone library (tabs) + full-screen reader + bottom sheets for editing */
:root{
  --paper:#f7f6f1; --ink:#16171b; --muted:#6b6e78; --rule:#dcdad2;
  --pen:#1f4fbf; --pen-soft:#e4ebfa; --star:#c98a00; --card:#ffffff; --danger:#b3261e; --on-pen:#fff;
  --f-mark:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --f-head:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#15161a; --ink:#ecebe6; --muted:#9a9ca6; --rule:#2c2e35;
  --pen:#8fb0ff; --pen-soft:#1f2740; --star:#f0b93a; --card:#1c1d22; --danger:#ff8a80; --on-pen:#0d1220; color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
input,button,select,textarea{font:inherit;color:inherit}
input:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding-block:12px 8px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mark{font-family:var(--f-mark);font-size:1.9rem;line-height:1;direction:ltr}
.mark small{font-size:.85rem;color:var(--pen);margin-inline-start:6px}
.vol{font-family:var(--f-head);color:var(--muted);font-size:.85rem}
.search{margin-top:10px;display:flex;gap:8px}
.field{flex:1;min-width:0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--card)}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1.5px solid var(--ink);background:var(--card);padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.btn.ghost{border-color:var(--rule)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.9rem}
.pick{position:relative;overflow:hidden;display:inline-block}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.bookbar{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:10px;font-size:.92rem;flex-wrap:wrap}
.bookbar .name{min-width:0;flex:1 1 100%;color:var(--muted)}
.empty{margin-top:28px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{font-family:var(--f-head);font-weight:400;font-size:1.3rem;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.letter{font-family:var(--f-mark);font-size:1.3rem;color:var(--pen);margin:16px 0 2px;direction:ltr;text-align:right}
ul.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--rule)}
.list .open{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:12px 2px;text-align:right;cursor:pointer}
.list .t{font-weight:600;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.list .p{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;font-size:.9rem}
.list .chip{font-size:.72rem;background:var(--pen-soft);color:var(--pen);border-radius:4px;padding:1px 5px;margin-inline-start:6px;font-weight:700;direction:ltr}
.icon{border:0;background:none;font-size:1.15rem;line-height:1;cursor:pointer;color:var(--muted);padding:10px 8px;border-radius:6px;min-width:38px}
.icon.star.on{color:var(--star)}
.icon:disabled{opacity:.3}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.section-h h3{margin:0;font-family:var(--f-head);font-weight:400;font-size:1.15rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
details.box{margin-top:16px;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--card)}
details.box summary{cursor:pointer;font-weight:700}
details.box textarea{width:100%;min-height:130px;margin-top:8px;border:1px solid var(--rule);border-radius:6px;padding:8px;background:var(--paper);direction:ltr;font-family:ui-monospace,monospace;font-size:.85rem}
.num{width:5.5em;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
/* page grid */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.pcell{display:grid;gap:4px;min-width:0}
.pthumb{aspect-ratio:3/4;max-width:100%;width:100%;background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden;padding:0;cursor:pointer;position:relative}
.pthumb img{width:100%;height:100%;object-fit:contain;display:block}
.pthumb .n{position:absolute;top:4px;inset-inline-start:4px;background:rgba(22,23,27,.8);color:#fff;font-size:.75rem;border-radius:4px;padding:0 5px;font-variant-numeric:tabular-nums}
.pcell .cap{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:center}
.pcell .acts{display:flex;justify-content:space-between}
.pcell .acts .icon{padding:6px 4px;min-width:0;font-size:1rem}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.panel h3{margin:0;font-family:var(--f-head);font-weight:400;font-size:1.25rem}
.panel label{font-size:.85rem;color:var(--muted);display:grid;gap:4px}
.panel .field{width:100%}
.panel .btns{display:flex;gap:8px;flex-wrap:wrap}
/* chord editor */
.chartin{width:100%;min-height:150px;border:1.5px solid var(--rule);border-radius:8px;padding:10px;background:var(--card);direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:1rem;line-height:1.6}
.keys{display:grid;gap:6px;direction:ltr}
.keys .kr{display:flex;gap:5px;flex-wrap:wrap}
.keys button{flex:1 0 auto;min-width:40px;border:1px solid var(--rule);background:var(--card);border-radius:6px;padding:9px 6px;font-weight:700;cursor:pointer;touch-action:manipulation}
.keys button.root{background:var(--pen-soft);color:var(--pen);border-color:transparent;font-size:1.05rem}
/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:600;z-index:60;max-width:90%;text-align:center}

/* Reader */
.reader{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column}
.reader.night{background:#111}
.reader.night .stage canvas{filter:invert(1) hue-rotate(180deg)}
.stage{flex:1;overflow:auto;position:relative;touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.stage canvas{display:block;margin:0 auto;max-width:none}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:4px;background:rgba(22,23,27,.93);color:#f2f1ec;z-index:3;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));transition:transform .2s}
.bar.topb{top:0;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
.bar.botb{bottom:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-top:6px}
.reader.chromeless .topb{transform:translateY(-110%)}
.reader.chromeless .botb{transform:translateY(110%)}
.bar button{background:none;border:0;color:inherit;font-size:1.05rem;padding:8px 9px;cursor:pointer;border-radius:6px;flex:none}
.bar button.on{color:#f0b93a}
.bar .title{flex:1;min-width:0;font-family:var(--f-head);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;direction:ltr}
.bar input[type=range]{flex:1;min-width:0;accent-color:#8fb0ff}
.bar .pg{direction:ltr;font-variant-numeric:tabular-nums;min-width:4.5em;text-align:center;font-size:.9rem}
.menu{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:4;background:#1f2026;color:#f2f1ec;border-radius:10px;padding:6px;display:grid;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.menu button{background:none;border:0;color:inherit;text-align:right;padding:11px 12px;border-radius:6px;cursor:pointer;font-size:1rem}
.menu button:hover{background:#2c2e36}
.scrollctl{position:absolute;z-index:3;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:rgba(22,23,27,.9);color:#fff;border-radius:999px;padding:4px}
.scrollctl button{background:none;border:0;color:inherit;font-size:1.1rem;padding:8px 12px;cursor:pointer;border-radius:999px}
.scrollctl span{font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center;font-size:.9rem}
.setbadge{position:absolute;z-index:3;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--pen);color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;direction:rtl;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-family:var(--f-head);pointer-events:none}
/* chord chart view */
.chartview{position:absolute;inset:0;z-index:2;overflow:auto;background:#fffdf7;color:#16171b;
  padding:calc(64px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(80px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.reader.night .chartview{background:#121317;color:#ecebe6}
.cv-head{display:grid;gap:8px;max-width:760px;margin:0 auto 14px}
.cv-title{font-family:var(--f-mark);font-size:1.8rem;line-height:1.1;direction:ltr;text-align:center;margin:0}
.cv-ctl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;direction:ltr}
.cv-ctl button{border:1.5px solid currentColor;background:transparent;border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer;color:inherit;opacity:.85}
.cv-ctl button.on{background:#1f4fbf;border-color:#1f4fbf;color:#fff;opacity:1}
.cv-ctl .keyread{font-family:var(--f-head);font-size:1.05rem;min-width:7em;text-align:center}
.grid{max-width:760px;margin:0 auto;display:grid;gap:0;direction:ltr}
.gline{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-left:2px solid currentColor}
.gbar{border-right:2px solid currentColor;padding:12px 6px;min-height:64px;display:flex;align-items:center;justify-content:space-around;gap:4px;flex-wrap:wrap;
  font-family:var(--f-mark);font-size:clamp(1rem,4.6vw,1.6rem);border-bottom:1px solid rgba(128,128,128,.25)}
.gbar .x{opacity:.55}
.cv-empty{text-align:center;display:grid;gap:12px;justify-items:center;margin-top:30px;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
/* crop editor */
.editor{position:fixed;inset:0;z-index:50;background:#0d0e11;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.editor .ehead,.editor .efoot{display:flex;gap:8px;align-items:center;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.editor .ehead{justify-content:space-between}
.editor .estage{flex:1;position:relative;overflow:hidden;touch-action:none}
.editor canvas{position:absolute;inset:0;width:100%;height:100%}
.editor button{background:#24262d;border:0;color:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}
.editor button.primary{background:#8fb0ff;color:#0d1220}
.editor input[type=range]{flex:1;min-width:120px;accent-color:#8fb0ff}
.editor .lbl{font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums;min-width:3.5em;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="mark">The Real Book<small>Vol.</small></div>
      <div class="vol" id="count">0 שירים</div>
    </div>
    <div class="search"><input class="field" id="q" type="search" placeholder="חיפוש שיר… (Autumn, Blue…)" autocomplete="off" aria-label="חיפוש שיר"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">כל השירים</button>
      <button class="tab" role="tab" data-tab="fav" aria-selected="false">מועדפים</button>
      <button class="tab" role="tab" data-tab="recent" aria-selected="false">אחרונים</button>
      <button class="tab" role="tab" data-tab="sets" aria-selected="false">רשימות הופעה</button>
      <button class="tab" role="tab" data-tab="pages" aria-selected="false">עמודים</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">הגדרות</button>
    </div>
  </header>

  <div class="bookbar" id="bookbar">
    <span class="name" id="bookname">עוד לא נטען ספר</span>
    <label class="btn primary pick">📷 הוסף תמונות<input type="file" id="fileImg" accept="image/*" multiple></label>
    <label class="btn ghost pick">טען PDF<input type="file" id="filePdf" accept="application/pdf,.pdf"></label>
    <button class="btn ghost" id="openBook" hidden>פתח ספר</button>
  </div>

  <main id="view"></main>
</div>

<!-- Reader -->
<div class="reader" id="reader" hidden>
  <div class="bar topb">
    <button id="rBack" aria-label="חזרה">→</button>
    <div class="title" id="rTitle"></div>
    <button id="rChords" aria-label="אקורדים והחלפת סולם">♯♭</button>
    <button id="rAdd" aria-label="תן שם לשיר בעמוד הזה">＋</button>
    <button id="rMore" aria-label="עוד">⋮</button>
  </div>
  <div class="menu" id="rMenu" hidden>
    <button data-act="scroll">⇩ גלילה אוטומטית</button>
    <button data-act="fit">⇕ כל העמוד במסך / לרוחב</button>
    <button data-act="night">☾ מצב לילה</button>
    <button data-act="edit">✂ סובב / חתוך עמוד זה</button>
  </div>
  <div class="stage" id="stage"><div class="loading" id="rLoading">טוען…</div></div>
  <div class="chartview" id="chartView" hidden></div>
  <div class="scrollctl" id="scrollCtl" hidden>
    <button id="scPlay" aria-label="הפעל או עצור">⏸</button>
    <button id="scSlow" aria-label="לאט יותר">−</button>
    <span id="scVal">3</span>
    <button id="scFast" aria-label="מהר יותר">+</button>
    <button id="scClose" aria-label="סגור גלילה">✕</button>
  </div>
  <div class="setbadge" id="setBadge" hidden></div>
  <div class="bar botb">
    <button id="rPrev" aria-label="הקודם">›</button>
    <input type="range" id="rRange" min="1" max="1" value="1" aria-label="מעבר לעמוד">
    <span class="pg" id="rPg">1</span>
    <button id="rNext" aria-label="הבא">‹</button>
  </div>
</div>

<!-- Crop / rotate editor -->
<div class="editor" id="editor" hidden>
  <div class="ehead">
    <button id="eCancel">ביטול</button>
    <strong id="eTitle">עריכת עמוד</strong>
    <button class="primary" id="eSave">שמור</button>
  </div>
  <div class="estage" id="eStage"><canvas id="eCv"></canvas></div>
  <div class="efoot">
    <button id="eRotL" aria-label="סובב שמאלה">⟲ 90°</button>
    <button id="eRotR" aria-label="סובב ימינה">⟳ 90°</button>
    <button id="eReset">איפוס חיתוך</button>
  </div>
  <div class="efoot">
    <span>יישור</span>
    <input type="range" id="eAngle" min="-15" max="15" step="0.5" value="0" aria-label="יישור עדין">
    <span class="lbl" id="eAngleVal">0°</span>
  </div>
  <p class="hint" style="margin:0 16px 8px;color:#aaa">גרור את הפינות הכחולות כדי לחתוך. הזז את הפס כדי ליישר דף שצולם עקום.</p>
</div>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem('rb_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem('rb_'+k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function armConfirm(btn,label,fn){if(btn.dataset.arm){delete btn.dataset.arm;btn.textContent=label;fn()}else{btn.dataset.arm=1;const o=btn.textContent;btn.textContent='לחץ שוב לאישור';setTimeout(()=>{if(btn.dataset.arm){delete btn.dataset.arm;btn.textContent=o}},3000)}}

/* ---------- state + migration ---------- */
let songs=LS.get('songs2',null), favs, recent;
if(!songs){
  const old=LS.get('songs',[]), of=new Set(LS.get('favs',[])), orc=LS.get('recent',[]);
  const map={};songs=old.map(s=>{const id=uid();map[s.title+'|'+s.page]=id;return {id,title:s.title,page:s.page}});
  favs=[...of].map(k=>map[k]).filter(Boolean);recent=orc.map(k=>map[k]).filter(Boolean);
  LS.set('songs2',songs);LS.set('favs2',favs);LS.set('recent2',recent);
}else{favs=LS.get('favs2',[]);recent=LS.get('recent2',[])}
favs=new Set(favs);
let setlists=LS.get('setlists',[]);
let offset=LS.get('offset',0), night=LS.get('night',false), fitH=LS.get('fitH',false);
let speed=LS.get('speed',3), acc=LS.get('acc','auto');
let tab='all', openSet=null;
const saveSongs=()=>{songs.sort((a,b)=>a.title.localeCompare(b.title,'en',{sensitivity:'base'}));LS.set('songs2',songs)};
const saveFavs=()=>LS.set('favs2',[...favs]);
const saveSets=()=>LS.set('setlists',setlists);
const songById=id=>songs.find(s=>s.id===id);

/* ---------- storage (IndexedDB) ---------- */
let _db;
function db(){if(_db)return Promise.resolve(_db);return new Promise((res,rej)=>{try{const r=indexedDB.open('realbook',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{_db=r.result;res(_db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbPut(v){try{const d=await db();await new Promise((res,rej)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put(v,'book');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){toast('השמירה בטלפון נכשלה. ייתכן שאין מספיק מקום.')}}
async function idbGet(){try{const d=await db();return await new Promise(r=>{const q=d.transaction('f').objectStore('f').get('book');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}

/* ---------- book ---------- */
let book=null; // {type:'img',imgs:[Blob],name} | {type:'pdf',pdf,buf,name}
const nPages=()=>book?(book.type==='img'?book.imgs.length:book.pdf.numPages):0;
const persistImgs=()=>idbPut({imgs:book.imgs,name:book.name});
const bmCache=new Map();
async function bitmapOf(blob){
  if(bmCache.has(blob))return bmCache.get(blob);
  let bm;
  try{bm=await createImageBitmap(blob)}catch(e){
    bm=await new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=rej;im.src=u})}
  bmCache.set(blob,bm);if(bmCache.size>5){const k=bmCache.keys().next().value;const v=bmCache.get(k);bmCache.delete(k);try{v.close&&v.close()}catch(e){}}
  return bm;
}
const dims=bm=>({w:bm.width||bm.naturalWidth,h:bm.height||bm.naturalHeight});
async function pageSrc(i){
  if(book.type==='img'){const bm=await bitmapOf(book.imgs[i-1]);const {w,h}=dims(bm);
    return {w,h,draw:async(ctx,W,H)=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.drawImage(bm,0,0,W,H)}}}
  const p=await book.pdf.getPage(i);const v=p.getViewport({scale:1});
  return {w:v.width,h:v.height,draw:async(ctx,W,H)=>{await p.render({canvasContext:ctx,viewport:p.getViewport({scale:W/v.width})}).promise}};
}
async function shrink(file){
  try{const bm=await createImageBitmap(file);const M=2200;const {w,h}=dims(bm);const s=Math.min(1,M/Math.max(w,h));
    if(s===1&&file.size<2.5e6){bm.close&&bm.close();return file}
    const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(bm,0,0,c.width,c.height);bm.close&&bm.close();
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.88))}catch(e){return file}
}
async function openPdfBuf(buf,name){
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false}).promise;
    book={type:'pdf',pdf,buf,name};bookChanged();return true;
  }catch(e){toast('לא הצלחתי לפתוח את הקובץ. ודא שזה PDF תקין.');return false}
}
function bookChanged(){
  $('bookname').textContent=book?((book.type==='img'?'תמונות':book.name)+' · '+nPages()+' עמודים'):'עוד לא נטען ספר';
  $('openBook').hidden=!book||!nPages();$('rRange').max=Math.max(1,nPages());render();
}
$('fileImg').onchange=async e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|heic|webp)$/i.test(f.name));e.target.value='';
  if(!files.length)return;files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  toast('מעבד '+files.length+' תמונות…');
  const out=[];for(const f of files)out.push(await shrink(f));
  if(!book||book.type!=='img')book={type:'img',imgs:[],name:'תמונות'};
  book.imgs=book.imgs.concat(out);await persistImgs();bookChanged();
  toast('נוספו '+out.length+' עמודים. לחץ פתח ספר ותן שם לשיר עם ＋');
};
$('filePdf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const buf=await f.arrayBuffer();
  if(await openPdfBuf(buf,f.name)){await idbPut({buf,name:f.name});toast('הספר נשמר בטלפון')}};

/* ---------- songs helpers ---------- */
const pdfPage=s=>s.page+offset;
function songsByPage(){return songs.slice().sort((a,b)=>a.page-b.page)}
function songRange(s){const st=pdfPage(s);const nx=songsByPage().find(x=>pdfPage(x)>st);
  let en=nx?pdfPage(nx)-1:st;en=Math.max(st,Math.min(en,st+5,nPages()||st));return [st,en]}
function songAt(p){let best=null;for(const s of songs){const sp=pdfPage(s);if(sp<=p&&(!best||sp>pdfPage(best)))best=s}
  if(!best)return null;const [st,en]=songRange(best);return p<=en?best:null}
function parseIndex(text){
  const out=[];text.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
    let m=l.match(/^(.*?)[\s,;|\t.\-–]+(\d{1,4})\s*$/);
    if(m&&m[1].trim()){out.push({title:m[1].trim(),page:+m[2]});return}
    m=l.match(/^(\d{1,4})[\s,;|\t.\-–]+(.+)$/);if(m)out.push({title:m[2].trim(),page:+m[1]})});
  return out;
}

function emptyBox(title,text,btn){return `<div class="empty"><svg viewBox="0 0 280 70" width="260" height="65" aria-hidden="true" style="max-width:100%">${[0,1,2,3,4].map(i=>`<line x1="0" x2="280" y1="${14+i*10}" y2="${14+i*10}" stroke="currentColor" stroke-width="1" opacity=".3"/>`).join('')}<text x="140" y="46" text-anchor="middle" font-family="Permanent Marker, cursive" font-size="22" fill="currentColor">Cmaj7  A7  Dm7  G7</text></svg><h2>${title}</h2><p>${text}</p>${btn||''}</div>`}
function songRow(s,extra){
  const li=document.createElement('li');
  li.innerHTML=`<button class="open"><span class="t"></span><span class="p">${s.chart?'<span class="chip">♯♭</span>':''} עמ׳ ${s.page}</span></button>${extra||''}<button class="icon star${favs.has(s.id)?' on':''}" aria-label="מועדף">★</button><button class="icon more" aria-label="עריכה">⋯</button>`;
  li.querySelector('.t').textContent=s.title;
  li.querySelector('.open').onclick=()=>openSong(s);

function renderSongs(V){
  const q=$('q').value.trim().toLowerCase();
  let list=songs;
  if(tab==='fav')list=songs.filter(s=>favs.has(s.id));
  if(tab==='recent')list=recent.map(songById).filter(Boolean);
  if(q)list=list.filter(s=>s.title.toLowerCase().includes(q)||String(s.page)===q);
  V.innerHTML='';
  if(!songs.length){
    V.innerHTML=emptyBox('הספרייה עוד ריקה',book?'פתח את הספר, דפדף לשיר ולחץ ＋ למעלה כדי לתת לו שם. אפשר גם להדביק אינדקס שלם בהגדרות.':'הוסף תמונות של דפים או קובץ PDF של הספר, ואחר כך תן שמות לשירים.',book?'<button class="btn primary" id="goRead">פתח ספר</button>':'');
    const g=$('goRead');if(g)g.onclick=()=>openReader(1);return;
  }
  if(!list.length){V.innerHTML=`<div class="empty"><p>${tab==='fav'?'אין עדיין מועדפים. סמן כוכב ליד שיר.':tab==='recent'?'עוד לא פתחת שירים.':'לא נמצא שיר בשם הזה.'}</p></div>`;return}
  let cur=null,ul=null;
  list.forEach(s=>{
    const ch=tab==='recent'?'':((s.title[0]||'#').toUpperCase().match(/[A-Z]/)?s.title[0].toUpperCase():'#');
    if(!ul||ch!==cur){cur=ch;if(ch){const h=document.createElement('div');h.className='letter';h.textContent=ch;V.appendChild(h)}
      ul=document.createElement('ul');ul.className='list';V.appendChild(ul)}
    ul.appendChild(songRow(s));
  });
}

/* pages manager */
let thumbURLs=[];
function renderPages(V){
  thumbURLs.forEach(u=>URL.revokeObjectURL(u));thumbURLs=[];
  if(!book){V.innerHTML=emptyBox('אין עמודים','הוסף תמונות של דפים עם הכפתור 📷 למעלה.');return}
  if(book.type!=='img'){V.innerHTML=`<div class="empty"><p>ניהול עמודים (סיבוב, חיתוך, מחיקה וסידור) עובד על ספר מתמונות. בספר PDF אפשר לדפדף ולתת שמות לשירים.</p></div>`;return}
  const n=book.imgs.length;
  V.innerHTML=`<div class="section-h"><h3>${n} עמודים</h3><span class="hint" style="margin:0">החצים מזיזים עמוד, ✂ לסיבוב וחיתוך</span></div><div class="pgrid" id="pgrid"></div>`;
  const G=$('pgrid');
  book.imgs.forEach((b,i)=>{
    const p=i+1, s=songAt(p), u=URL.createObjectURL(b);thumbURLs.push(u);
    const c=document.createElement('div');c.className='pcell';
    c.innerHTML=`<button class="pthumb" aria-label="פתח עמוד ${p}"><img loading="lazy" decoding="async" alt=""><span class="n">${p}</span></button>
      <div class="cap"></div>
      <div class="acts"><button class="icon" data-a="up" ${i===0?'disabled':''} aria-label="הזז קדימה">→</button><button class="icon" data-a="edit" aria-label="סובב וחתוך">✂</button><button class="icon" data-a="del" aria-label="מחק">🗑</button><button class="icon" data-a="down" ${i===n-1?'disabled':''} aria-label="הזז אחורה">←</button></div>`;
    c.querySelector('img').src=u;c.querySelector('.cap').textContent=s&&pdfPage(s)===p?s.title:' ';
    c.querySelector('.pthumb').onclick=()=>openReader(p);
    c.querySelector('[data-a=up]').onclick=()=>movePage(i,i-1);
    c.querySelector('[data-a=down]').onclick=()=>movePage(i,i+1);
    c.querySelector('[data-a=edit]').onclick=()=>openEditor(p);
    c.querySelector('[data-a=del]').onclick=e=>{const btn=e.currentTarget;if(btn.dataset.arm){deletePage(i)}else{btn.dataset.arm=1;btn.textContent='✓?';setTimeout(()=>{delete btn.dataset.arm;btn.textContent='🗑'},2500)}};
    G.appendChild(c);
  });
}
async function movePage(a,b){
  const im=book.imgs;[im[a],im[b]]=[im[b],im[a]];
  const pa=a+1,pb=b+1;songs.forEach(s=>{const sp=pdfPage(s);if(sp===pa)s.page=pb-offset;else if(sp===pb)s.page=pa-offset});
  saveSongs();await persistImgs();render();
}
async function deletePage(i){
  const p=i+1;book.imgs.splice(i,1);
  const gone=songs.filter(s=>pdfPage(s)===p).map(s=>s.id);
  songs=songs.filter(s=>pdfPage(s)!==p);songs.forEach(s=>{if(pdfPage(s)>p)s.page--});
  gone.forEach(id=>{favs.delete(id)});recent=recent.filter(id=>!gone.includes(id));
  setlists.forEach(l=>l.items=l.items.filter(id=>!gone.includes(id)));
  saveSongs();saveFavs();LS.set('recent2',recent);saveSets();
  if(!book.imgs.length){book=null;await idbPut({imgs:[],name:'תמונות'})}else await persistImgs();
  bookChanged();toast('העמוד נמחק');
}

/* ---------- chords: parse + transpose ---------- */
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function nIdx(n){const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]];let a=0;for(const c of n.slice(1)){if(c==='#'||c==='♯')a++;else if(c==='b'||c==='♭')a--}return (b+a+120)%12}
const CHORD=/^([A-G](?:#|b|♯|♭)?)([^/]*?)(?:\/([A-G](?:#|b|♯|♭)?))?$/;
function useSharps(s,shift){
  if(acc==='#')return true;if(acc==='b')return false;
  if(!s.key)return false;let k=nIdx(s.key);if(/m$/.test(s.key))k=(k+3)%12;const t=(k+shift)%12;return [7,2,9,4,11,6].includes(t);
}
const pretty=t=>t.replace(/([A-G])b/g,'$1♭').replace(/([A-G])#/g,'$1♯').replace(/b(?=\d)/g,'♭').replace(/#(?=\d)/g,'♯');
function trTok(tok,shift,sharp){
  const m=tok.match(/^(\(?)(.*?)(\)?)$/);const core=m[2];const c=core.match(CHORD);
  if(!c||!core)return {t:tok,chord:false};
  const N=sharp?SH:FL;const r=N[(nIdx(c[1])+shift+120)%12];const bass=c[3]?'/'+N[(nIdx(c[3])+shift+120)%12]:'';
  return {t:m[1]+r+c[2]+bass+m[3],chord:true};
}
function keyName(s,shift){if(!s.key)return '';const minor=/m$/.test(s.key);const N=useSharps(s,shift)?SH:FL;return N[(nIdx(s.key)+shift+120)%12]+(minor?'m':'')}

      <div class="kr">${['maj7','7','m7','m7b5','dim7','6','m6','9','13','sus4','7b9','7#9','7#11','7alt'].map(k=>`<button data-k="${k}">${pretty(k)}</button>`).join('')}</div>

let ed=null; // {p,bm,rot,angle,crop:{x,y,w,h} normalized, work:canvas, view:{ox,oy,s}}
async function openEditor(p){

function buildWork(){
  const {w,h}=dims(ed.bm);const M=1400;const s0=Math.min(1,M/Math.max(w,h));
  const a=(ed.rot*90+ed.angle)*Math.PI/180;const c=Math.abs(Math.cos(a)),sn=Math.abs(Math.sin(a));

  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.translate(W/2,H/2);x.rotate(a);x.drawImage(ed.bm,-w*s0/2,-h*s0/2,w*s0,h*s0);
  ed.work=cv;drawEd();
}
function drawEd(){
  const st=$('eStage'),cv=$('eCv');const dpr=window.devicePixelRatio||1;const SW=st.clientWidth,SH=st.clientHeight;
  cv.width=SW*dpr;cv.height=SH*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,SW,SH);
  const pad=22;const s=Math.min((SW-2*pad)/ed.work.width,(SH-2*pad)/ed.work.height);const dw=ed.work.width*s,dh=ed.work.height*s;
  const ox=(SW-dw)/2,oy=(SH-dh)/2;ed.view={ox,oy,dw,dh};x.drawImage(ed.work,ox,oy,dw,dh);
  const c=ed.crop,cx=ox+c.x*dw,cy=oy+c.y*dh,cw=c.w*dw,ch=c.h*dh;
  x.fillStyle='rgba(0,0,0,.55)';x.beginPath();x.rect(ox,oy,dw,dh);x.rect(cx,cy,cw,ch);x.fill('evenodd');

  x.fillStyle='#8fb0ff';[[cx,cy],[cx+cw,cy],[cx,cy+ch],[cx+cw,cy+ch]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,10,0,7);x.fill()});
}
(function(){let drag=null;const st=$('eStage');
  st.addEventListener('pointerdown',e=>{if(!ed)return;const r=st.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;const v=ed.view,c=ed.crop;
    const pts={tl:[v.ox+c.x*v.dw,v.oy+c.y*v.dh],tr:[v.ox+(c.x+c.w)*v.dw,v.oy+c.y*v.dh],bl:[v.ox+c.x*v.dw,v.oy+(c.y+c.h)*v.dh],br:[v.ox+(c.x+c.w)*v.dw,v.oy+(c.y+c.h)*v.dh]};
    let best=null,bd=40;for(const k in pts){const d=Math.hypot(px-pts[k][0],py-pts[k][1]);if(d<bd){bd=d;best=k}}
    if(!best&&px>pts.tl[0]&&px<pts.br[0]&&py>pts.tl[1]&&py<pts.br[1])best='move';
    if(best){drag={k:best,px,py,c:{...c}};st.setPointerCapture(e.pointerId)}});
  st.addEventListener('pointermove',e=>{if(!drag)return;const r=st.getBoundingClientRect();const v=ed.view;
    const dx=(e.clientX-r.left-drag.px)/v.dw,dy=(e.clientY-r.top-drag.py)/v.dh;let {x,y,w,h}=drag.c;const m=.05;
    if(drag.k==='move'){x=Math.min(1-w,Math.max(0,x+dx));y=Math.min(1-h,Math.max(0,y+dy))}
    else{if(drag.k[1]==='l'){const nx=Math.min(x+w-m,Math.max(0,x+dx));w+=x-nx;x=nx}else w=Math.min(1-x,Math.max(m,w+dx));
      if(drag.k[0]==='t'){const ny=Math.min(y+h-m,Math.max(0,y+dy));h+=y-ny;y=ny}else h=Math.min(1-y,Math.max(m,h+dy))}
    ed.crop={x,y,w,h};drawEd()});
  const end=()=>{drag=null};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
})();
$('eRotL').onclick=()=>{ed.rot=(ed.rot+3)%4;ed.crop={x:0,y:0,w:1,h:1};buildWork()};
$('eRotR').onclick=()=>{ed.rot=(ed.rot+1)%4;ed.crop={x:0,y:0,w:1,h:1};buildWork()};
$('eReset').onclick=()=>{ed.crop={x:0,y:0,w:1,h:1};drawEd()};
$('eAngle').oninput=e=>{ed.angle=+e.target.value;$('eAngleVal').textContent=ed.angle+'°';buildWork()};
$('eCancel').onclick=()=>{$('editor').hidden=true;ed=null};
window.addEventListener('resize',()=>{if(ed)drawEd()});
$('eSave').onclick=async()=>{
  const {w,h}=dims(ed.bm);const a=(ed.rot*90+ed.angle)*Math.PI/180;const c=Math.abs(Math.cos(a)),sn=Math.abs(Math.sin(a));
  const W=w*c+h*sn,H=w*sn+h*c;const cr=ed.crop;const outW=Math.round(cr.w*W),outH=Math.round(cr.h*H);
  const cv=document.createElement('canvas');cv.width=outW;cv.height=outH;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,outW,outH);x.translate(-cr.x*W,-cr.y*H);x.translate(W/2,H/2);x.rotate(a);x.drawImage(ed.bm,-w/2,-h/2,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));if(!blob){toast('השמירה נכשלה');return}
  book.imgs[ed.p-1]=blob;await persistImgs();const p=ed.p;$('editor').hidden=true;ed=null;toast('העמוד עודכן');
  if(!$('reader').hidden)go(p);else render();
};

/* ---------- backup ---------- */
const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function exportBackup(){
  toast('מכין גיבוי…');
  const meta={v:2,songs,favs:[...favs],recent,setlists,offset,acc,book:book?{type:book.type,name:book.name}:null};
  const parts=['{"meta":'+JSON.stringify(meta)+',"data":['];
  if(book){if(book.type==='img'){for(let i=0;i<book.imgs.length;i++){parts.push((i?',':'')+JSON.stringify(await blobToDataURL(book.imgs[i])))}}
    else parts.push(JSON.stringify(await blobToDataURL(new Blob([book.buf],{type:'application/pdf'}))))}
  parts.push(']}');
  const d=new Date();const name=`realbook-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const file=new File(parts,name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'גיבוי Real Book'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);
  toast('הגיבוי נשמר בהורדות');
}
async function importBackup(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;toast('משחזר…');
  try{const j=JSON.parse(await f.text());const m=j.meta;if(!m||!Array.isArray(m.songs))throw 0;
    songs=m.songs;favs=new Set(m.favs||[]);recent=m.recent||[];setlists=m.setlists||[];offset=m.offset||0;acc=m.acc||'auto';
    saveSongs();saveFavs();LS.set('recent2',recent);saveSets();LS.set('offset',offset);LS.set('acc',acc);
    if(m.book&&m.book.type==='img'){const imgs=[];for(const d of j.data)imgs.push(await (await fetch(d)).blob());book={type:'img',imgs,name:'תמונות'};await persistImgs()}
    else if(m.book&&m.book.type==='pdf'){const buf=await (await (await fetch(j.data[0])).blob()).arrayBuffer();await openPdfBuf(buf,m.book.name);await idbPut({buf,name:m.book.name})}
    bookChanged();toast('השחזור הושלם: '+songs.length+' שירים, '+nPages()+' עמודים');
  }catch(err){toast('הקובץ הזה לא נראה כמו גיבוי של Real Book')}
}

/* ---------- boot ---------- */
render();
idbGet().then(async r=>{if(!r)return;
  if(r.imgs&&r.imgs.length){book={type:'img',imgs:r.imgs,name:r.name||'תמונות'};bookChanged()}
  else if(r.buf){await openPdfBuf(r.buf,r.name)}});
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
